name: Biome
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run check
        run: pnpm check:ci
