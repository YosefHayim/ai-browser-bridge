name: Test
'on':
  workflow_call:
    inputs:
      since:
        description: Base commit to check changes against. Empty checks everything.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run full check
        if: inputs.since == ''
        run: pnpm test
      - name: Run changed check
        if: inputs.since != ''
        env:
          SINCE: ${{ inputs.since }}
        run: pnpm exec vitest run --changed "$SINCE"
