name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report-failure:
    name: Open issue on main failure
    needs:
    - biome
    - style
    - typecheck
    - test
    - build
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/report-failure.yml
  biome:
    uses: ./.github/workflows/biome.yml
  style:
    uses: ./.github/workflows/style.yml
  typecheck:
    uses: ./.github/workflows/typecheck.yml
  test:
    uses: ./.github/workflows/test.yml
  build:
    uses: ./.github/workflows/build.yml
  gate:
    name: CI Gate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs:
    - biome
    - style
    - typecheck
    - test
    - build
    if: always()
    steps:
    - name: Require every check to pass
      run: test "${{ needs.biome.result }}" = "success" && test "${{ needs.style.result }}" = "success" && test "${{ needs.typecheck.result
        }}" = "success" && test "${{ needs.test.result }}" = "success" && test "${{ needs.build.result }}" = "success"
